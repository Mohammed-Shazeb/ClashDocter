services:
  - type: web
    name: clashdoctor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: QLOO_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
